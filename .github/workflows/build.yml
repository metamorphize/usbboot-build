#
# Build rpiboot (raspberrypi/usbboot) for macOS
#
# - Checkout raspberrypi/usbboot
# - Install dependencies (libusb, pkg-config)
# - Build
# - Include and update libusb linker path
# - Archive (as bundle including libusb)
# - Create GitHub Release
#


name: Build rpiboot (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: raspberrypi/usbboot
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew update
          brew install libusb pkg-config

      - name: Build
        run: |
          make

      - name: Bundle dependencies
        run: |
          LIBUSB_PATH=$(brew --prefix libusb)/lib/libusb-1.0.0.dylib
        
          mkdir -p bundle/lib
          cp rpiboot bundle/
          cp "$LIBUSB_PATH" bundle/lib/

          # Change dynamic linker path
          install_name_tool -change "$LIBUSB_PATH" \
            @rpath/libusb-1.0.0.dylib \
            bundle/rpiboot
      
          install_name_tool -add_rpath @executable_path/lib bundle/rpiboot

          # Check if libusb was bundled correctly
          otool -L bundle/rpiboot

      - name: Archive bundle
        run: |
          tar -czf rpiboot-macos.tar.gz -C bundle .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            rpiboot-macos.tar.gz \
            --title "rpiboot $GITHUB_REF_NAME" \
            --notes "rpiboot macOS build with bundled libusb"
