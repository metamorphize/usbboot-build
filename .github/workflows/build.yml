name: Build rpiboot (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: raspberrypi/usbboot
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew update
          brew install libusb pkg-config

      - name: Build
        run: |
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpiboot
          path: rpiboot
