#
# Build rpiboot (raspberrypi/usbboot) for macOS
#
# - Checkout raspberrypi/usbboot
# - Install dependencies (libusb, pkg-config)
# - Build
# - Include and update libusb linker path
# - Archive (as bundle including libusb)
# - Create GitHub Release
#


name: Build rpiboot (macOS)

on:
  schedule:
    - cron: "0 0 15 2,5,8,11 *"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: raspberrypi/usbboot
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew update
          brew install libusb pkg-config

      - name: Build
        run: |
          make

      - name: Bundle dependencies
        run: |
          LIBUSB_PATH=$(brew --prefix libusb)/lib/libusb-1.0.0.dylib
        
          mkdir -p bundle/lib
          cp rpiboot bundle/
          cp "$LIBUSB_PATH" bundle/lib/

          # Change dynamic linker path
          install_name_tool -change "$LIBUSB_PATH" \
            @rpath/libusb-1.0.0.dylib \
            bundle/rpiboot
      
          install_name_tool -add_rpath @executable_path/lib bundle/rpiboot

          # otool -L bundle/rpiboot

      - name: Archive bundle
        run: |
          tar -czf rpiboot-macos.tar.gz -C bundle .

#      - name: Upload artifact
#        uses: actions/upload-artifact@v7
#        with:
#          name: rpiboot-macos
#          path: rpiboot-macos.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVISION="$(git rev-parse --short HEAD)"
          DATE="$(date +%Y/%m/%d)"
          gh release create "$REVISION" \
            rpiboot-macos.tar.gz \
            --title "rpiboot $DATE $REVISION" \
            --notes "[rpiboot](https://github.com/raspberrypi/usbboot) macOS build bundled with libusb" \
            --repo "$GITHUB_REPOSITORY"
